services:
  app:
    build: .
    ports: ["8765:80"]
    volumes: [".:/var/www/html"]
    env_file: .env
    command: >
      bash -c "[ -f config/app.php ] || cp config/app.default.php config/app.php;
      composer install --no-interaction --ignore-platform-reqs && mkdir -p tmp logs && chmod -R 777 tmp logs && apache2-foreground"
